services:
  - type: web
    name: ai-radar-backend
    runtime: python
    repo: https://github.com/hopeman-ai/ai-radar.git
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
